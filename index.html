<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greek Flashcards</title>
<style>
  :root {
    --limestone: #f2ede2;
    --limestone-dim: #e6ddc9;
    --aegean: #1d3f5c;
    --aegean-deep: #0f2740;
    --terracotta: #bd5b38;
    --olive: #6b7a4f;
    --ink: #23201a;
    --paper-shadow: rgba(15, 39, 64, 0.18);
    --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-body: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--limestone);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(29,63,92,0.05) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(189,91,56,0.06) 0, transparent 45%);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }

  header {
    text-align: center;
    max-width: 560px;
    margin-bottom: 28px;
  }

  header .eyebrow {
    font-family: var(--font-body);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--terracotta);
    font-weight: 700;
  }

  header h1 {
    font-family: var(--font-display);
    font-size: 34px;
    margin: 6px 0 4px;
    color: var(--aegean-deep);
    font-weight: 600;
  }

  header p {
    margin: 0;
    font-size: 14px;
    color: #5a5648;
  }

  .lesson-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 640px;
    margin-bottom: 22px;
  }

  .lesson-tab {
    border: 1px solid var(--aegean);
    background: transparent;
    color: var(--aegean-deep);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }

  .lesson-tab:hover { transform: translateY(-1px); }

  .lesson-tab.active {
    background: var(--aegean);
    color: var(--limestone);
  }

  .stage {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .progress {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #7a7462;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .card-frame {
    width: 100%;
    aspect-ratio: 4 / 3;
    perspective: 1200px;
    cursor: pointer;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }

  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    box-shadow: 0 18px 34px var(--paper-shadow);
    border: 1px solid rgba(15,39,64,0.12);
  }

  .face.front {
    background: var(--limestone);
    background-image: linear-gradient(160deg, #ffffff 0%, var(--limestone-dim) 100%);
  }

  .face.back {
    background: var(--aegean-deep);
    color: var(--limestone);
    transform: rotateY(180deg);
    background-image: linear-gradient(160deg, var(--aegean) 0%, var(--aegean-deep) 100%);
  }

  .stamp {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--terracotta);
    font-weight: 700;
    opacity: 0.8;
  }

  .face.back .stamp { color: #d99a84; }

  .greek-word {
    font-family: var(--font-display);
    font-size: 42px;
    color: var(--aegean-deep);
    line-height: 1.15;
  }

  .translit {
    margin-top: 10px;
    font-size: 14px;
    color: var(--terracotta);
    font-style: italic;
  }

  .english-word {
    font-family: var(--font-display);
    font-size: 26px;
    line-height: 1.3;
  }

  .tap-hint {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9c9683;
  }

  .face.back .tap-hint { color: #a9bdcd; }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 22px;
  }

  .nav-btn {
    background: var(--olive);
    color: var(--limestone);
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .nav-btn:hover { transform: scale(1.06); }
  .nav-btn:active { transform: scale(0.96); }

  .shuffle-btn {
    background: transparent;
    border: 1px solid var(--terracotta);
    color: var(--terracotta);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .shuffle-btn:hover {
    background: var(--terracotta);
    color: var(--limestone);
  }

  .direction-btn {
    margin-top: 16px;
    background: var(--aegean-deep);
    color: var(--limestone);
    border: none;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 9px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .direction-btn:hover { transform: translateY(-1px); }

  footer {
    margin-top: 44px;
    max-width: 460px;
    font-size: 12px;
    color: #8a8672;
    text-align: center;
    line-height: 1.6;
  }

  footer code {
    background: var(--limestone-dim);
    padding: 1px 5px;
    border-radius: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .nav-btn, .shuffle-btn { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Ελληνικά &middot; Vocabulary Cards</div>
  <h1>Greek Flashcards</h1>
  <p>Tap a card to flip it. Use the arrows to move through the lesson.</p>
</header>

<div class="lesson-bar" id="lessonBar"></div>

<div class="stage">
  <div class="progress" id="progress">1 / 1</div>
  <div class="card-frame" id="cardFrame">
    <div class="card" id="card">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
  </div>
  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous card">&#8592;</button>
    <button class="shuffle-btn" id="shuffleBtn">Shuffle</button>
    <button class="nav-btn" id="nextBtn" aria-label="Next card">&#8594;</button>
  </div>
  <button class="direction-btn" id="directionBtn">Greek &#8594; English</button>
</div>

<footer>
  Add new lessons by editing the <code>LESSONS</code> array at the top of the
  script in this file &mdash; each entry needs a <code>title</code> and a
  <code>words</code> list of <code>{ gr, translit, en }</code> objects.
</footer>

  // ---------------------------------------------------------------------
  // App logic — no need to touch anything below to add lessons.
  // ---------------------------------------------------------------------
  let currentLesson = 0;
  let currentIndex = 0;
  let deck = [];
  let direction = 'gr-en'; // 'gr-en' = Greek front, English back. 'en-gr' = reverse.

  const lessonBar = document.getElementById('lessonBar');
  const card = document.getElementById('card');
  const cardFrame = document.getElementById('cardFrame');
  const frontFace = document.querySelector('.face.front');
  const backFace = document.querySelector('.face.back');
  const progress = document.getElementById('progress');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const directionBtn = document.getElementById('directionBtn');

  function buildTabs() {
    lessonBar.innerHTML = '';
    LESSONS.forEach((lesson, i) => {
      const btn = document.createElement('button');
      btn.className = 'lesson-tab' + (i === currentLesson ? ' active' : '');
      btn.textContent = lesson.title;
      btn.addEventListener('click', () => selectLesson(i));
      lessonBar.appendChild(btn);
    });
  }

  function selectLesson(i) {
    currentLesson = i;
    currentIndex = 0;
    deck = LESSONS[i].words.slice();
    buildTabs();
    renderCard();
  }

  function renderCard() {
    card.classList.remove('flipped');
    const item = deck[currentIndex];

    if (direction === 'gr-en') {
      frontFace.innerHTML = '<div class="stamp">GR</div>' +
        '<div class="greek-word" id="greekWord">' + item.gr + '</div>' +
        '<div class="translit" id="translitWord">' + item.translit + '</div>' +
        '<div class="tap-hint">tap to reveal</div>';
      backFace.innerHTML = '<div class="stamp">EN</div>' +
        '<div class="english-word" id="englishWord">' + item.en + '</div>' +
        '<div class="tap-hint">tap to flip back</div>';
    } else {
      frontFace.innerHTML = '<div class="stamp">EN</div>' +
        '<div class="english-word" id="englishWord">' + item.en + '</div>' +
        '<div class="tap-hint">tap to reveal</div>';
      backFace.innerHTML = '<div class="stamp">GR</div>' +
        '<div class="greek-word" id="greekWord">' + item.gr + '</div>' +
        '<div class="translit" id="translitWord">' + item.translit + '</div>' +
        '<div class="tap-hint">tap to flip back</div>';
    }

    progress.textContent = (currentIndex + 1) + ' / ' + deck.length;
  }

  function toggleDirection() {
    direction = direction === 'gr-en' ? 'en-gr' : 'gr-en';
    directionBtn.textContent = direction === 'gr-en' ? 'Greek \u2192 English' : 'English \u2192 Greek';
    renderCard();
  }

  function nextCard() {
    currentIndex = (currentIndex + 1) % deck.length;
    renderCard();
  }

  function prevCard() {
    currentIndex = (currentIndex - 1 + deck.length) % deck.length;
    renderCard();
  }

  function shuffleDeck() {
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    currentIndex = 0;
    renderCard();
  }

  cardFrame.addEventListener('click', () => card.classList.toggle('flipped'));
  prevBtn.addEventListener('click', prevCard);
  nextBtn.addEventListener('click', nextCard);
  shuffleBtn.addEventListener('click', shuffleDeck);
  directionBtn.addEventListener('click', toggleDirection);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextCard();
    if (e.key === 'ArrowLeft') prevCard();
    if (e.key === ' ') { e.preventDefault(); card.classList.toggle('flipped'); }
  });

  buildTabs();
  selectLesson(0);
</script>
